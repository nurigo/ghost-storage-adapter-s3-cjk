name: Secret Scan (Central)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  central-secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
      - name: Scan current files
        run: |
          gitleaks detect --source . --no-git --redact --exit-code 0 --report-format json --report-path /tmp/findings.json
          jq -er 'if type == "array" then length else error("Invalid report") end' /tmp/findings.json
          jq -r '.[] | "\(.File):\(.StartLine) [\(.RuleID)]"' /tmp/findings.json >> "$GITHUB_STEP_SUMMARY"
